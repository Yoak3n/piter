[workspace]
resolver = "2"
members = ["src-tauri", "crates/pi_server", "crates/pi_rpc"]

[workspace.dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
rusqlite = { version = "0.35", features = ["bundled"] }
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
