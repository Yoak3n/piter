name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # matrix 单 job 双平台：tauri-action 内部处理产物合并，
    # 避免两个独立 job 并行 uploadUpdaterJson 时 latest.json 互相覆盖
    name: Build & Release (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundle_args: --bundles nsis
            # updater 仅 Windows 启用（Linux 决策 D3：AUR 场景关内置 updater）
            updater_json: true
          - platform: ubuntu-latest
            bundle_args: --bundles appimage,deb
            updater_json: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 仅 Linux 需要：Tauri v2 系统依赖（webkit2gtk-4.1 等）
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            file \
            build-essential

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        # 不再显式设 targets：两平台默认 host target 即正确
        # （windows-latest 默认 msvc，linux 默认 gnu）

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # Flutter（work 模块 web 构建：build:work = flutter build web --base-href=/work/，
      # 产物经 bundle.resources 外置为 <install>/web/work）
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # 非 tag（main / PR / 手动）：仅构建，产物存 artifacts
      # 注意：tauri.conf.json 的 createUpdaterArtifacts 全局生效，任何构建都会尝试生成 .sig
      # 签名 → 必须传入签名密钥 env（即使非 release 构建）
      - name: Build (CI)
        if: github.ref_type != 'tag'
        uses: tauri-apps/tauri-action@v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.bundle_args }}
          uploadWorkflowArtifacts: true

      # tag（v*）：构建 + 创建 Release 草稿 + 上传产物
      - name: Build & Create Release Draft (tag)
        if: github.ref_type == 'tag'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.bundle_args }}
          tagName: v__VERSION__
          releaseName: "piter v__VERSION__"
          releaseBody: |
            ## piter v__VERSION__

            See the assets below to download and install this version.
          releaseDraft: true
          prerelease: false
          # 关键：只有 Windows 上传 latest.json（Linux 关 updater，避免覆盖）
          uploadUpdaterJson: ${{ matrix.updater_json }}
