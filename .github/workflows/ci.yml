name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # matrix 单 job 双平台：tauri-action 内部处理产物合并，
    # 避免两个独立 job 并行 uploadUpdaterJson 时 latest.json 互相覆盖
    name: Build & Release (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundle_args: --bundles nsis
            # updater 仅 Windows 启用（Linux 决策 D3：AUR 场景关内置 updater）
            updater_json: true
          - platform: ubuntu-latest
            bundle_args: --bundles appimage,deb
            updater_json: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 仅 Linux 需要：Tauri v2 系统依赖（webkit2gtk-4.1 等）
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            file \
            build-essential

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        # 不再显式设 targets：两平台默认 host target 即正确
        # （windows-latest 默认 msvc，linux 默认 gnu）

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # Flutter（work 模块 web 构建：build:work = flutter build web --base-href=/work/，
      # 产物经 bundle.resources 外置为 <install>/web/work）
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # 非 tag（main / PR / 手动）：仅构建，产物存 artifacts
      # 注意：tauri.conf.json 的 createUpdaterArtifacts 全局生效，任何构建都会尝试生成 .sig
      # 签名 → 必须传入签名密钥 env（即使非 release 构建）
      - name: Build (CI)
        if: github.ref_type != 'tag'
        uses: tauri-apps/tauri-action@v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.bundle_args }}
          uploadWorkflowArtifacts: true

      # tag（v*）：构建 + 创建 Release 草稿 + 上传产物
      - name: Build & Create Release Draft (tag)
        if: github.ref_type == 'tag'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.bundle_args }}
          tagName: v__VERSION__
          releaseName: "piter v__VERSION__"
          releaseBody: |
            ## piter v__VERSION__

            See the assets below to download and install this version.
          releaseDraft: true
          prerelease: false
          # 关键：只有 Windows 上传 latest.json（Linux 关 updater，避免覆盖）
          uploadUpdaterJson: ${{ matrix.updater_json }}

  # Android APK（Flutter 移动端 work 工程；非 tag 仅构建存 artifacts，tag 时上传 release）
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Flutter（ubuntu-latest runner 预装 Android SDK，无需 android-sdk 参数）
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build release APK (split per ABI)
        run: |
          cd work
          flutter pub get
          flutter build apk --release --split-per-abi

      # 非 tag：上传 APK 到 workflow artifacts（验证用）
      - name: Upload APK artifacts (CI)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: piter-android-apks
          path: work/build/app/outputs/flutter-apk/*.apk

      # tag：等 tauri-action 创建好 release 草稿后上传 APK（最多等 10 分钟）
      - name: Wait for release draft
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 60); do
            if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
              echo "release draft ready"
              exit 0
            fi
            sleep 10
          done
          echo "release draft not created within 10min" >&2
          exit 1

      - name: Upload APKs to release (tag)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # split-per-abi 产物：arm64-v8a / armeabi-v7a / x86_64，统一命名上传
          VER="${GITHUB_REF_NAME#v}"
          gh release upload "${GITHUB_REF_NAME}" "work/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk#piter_${VER}_android-arm64.apk" "work/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk#piter_${VER}_android-armv7.apk" "work/build/app/outputs/flutter-apk/app-x86_64-release.apk#piter_${VER}_android-x86_64.apk" --clobber

